<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8f8f5" />
    <title>Feed</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">A quiet place to catch up</p>
          <h1>Feed<span class="period">.</span></h1>
        </div>
        <button id="refresh" class="refresh-button" type="button" aria-label="Refresh feeds">Refresh</button>
      </header>

      <nav id="tabs" class="tabs" aria-label="Feeds"></nav>

      <main id="main" class="main" aria-live="polite">
        <div class="loading">Loading feeds…</div>
      </main>

      <footer class="site-footer">
        <span id="status" role="status">Reading from GitHub</span>
        <a href="https://github.com/alexk307/feed" target="_blank" rel="noopener noreferrer">View data</a>
      </footer>
    </div>
  </body>
</html>
